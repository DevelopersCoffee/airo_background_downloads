name: airo_background_downloads
description: Resilient background file transfer manager with WorkManager & URLSession native engines, checksum verification, network constraints, queue visualizer, encryption post-processing, and telemetry.
version: 1.1.0
homepage: https://developerscoffee.com
repository: https://github.com/DevelopersCoffee/airo_background_downloads
issue_tracker: https://github.com/DevelopersCoffee/airo_background_downloads/issues
documentation: https://github.com/DevelopersCoffee/airo_background_downloads#readme

topics:
  - downloads
  - background
  - resume
  - flutter
  - progressive

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.airo.platform_downloads
        pluginClass: PlatformDownloadsPlugin
      ios:
        pluginClass: PlatformDownloadsPlugin
